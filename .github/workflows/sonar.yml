name: Validação Sonar

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sonar-redis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes e relatórios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHON_DOTENV_DISABLED: "true"
      TEST_REDIS_ISOLATED: "1"
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Executar testes com JUnit e cobertura
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=app --cov-branch \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov
      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  scan:
    name: Análise Sonar
    needs: tests
    if: github.event_name == 'pull_request'
    uses: delta-app-ofc/.github/.github/workflows/sonar_scan.yml@d16a26074a524d0d414fa03b97931fb8d7713d90
    with:
      project_key: delta-app-ofc_delta-redis-database
      organization: delta-app-ofc
      artifact_name: sonar-reports
      artifact_path: reports
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
