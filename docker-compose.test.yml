# Suite isolada de testes: Redis efêmero, sem porta publicada e sem dados de dev.
services:
  redis:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - tests

  tests:
    image: python:3.12-slim
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
        mkdir -p /reports
        exec python -m pytest -q -p no:cacheprovider \
          --junitxml=/reports/junit.xml \
          --cov=app --cov-branch \
          --cov-report=xml:/reports/coverage.xml \
          --cov-report=html:/reports/htmlcov
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      TEST_REDIS_ISOLATED: "1"
      TEST_REDIS_URL: redis://redis:6379/1
    volumes:
      - ./app:/workspace/app:ro
      - ./tests:/workspace/tests:ro
      - ./requirements.txt:/workspace/requirements.txt:ro
      - ./requirements-dev.txt:/workspace/requirements-dev.txt:ro
      - ./reports:/reports
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tests

networks:
  tests:
